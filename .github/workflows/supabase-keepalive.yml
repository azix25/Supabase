name: Supabase Keep-Alive

on:
  schedule:
    # Berjalan otomatis setiap 4 hari sekali
    - cron: '0 0 */4 * *'
  # Memungkinkan Anda memicu ping secara manual lewat tab Actions
  workflow_dispatch:

jobs:
  keep_alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil data dari tabel keep_alive
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/keep_alive?select=*" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
